/* Professional pass. Calmer surfaces, one radius scale, Latin-first type so numbers and
   English read cleanly while Korean still falls through to Malgun Gothic. */
:root{--r-sm:6px;--r-md:9px;--radius:13px;--ink:#16241f;--muted:#5c6c65;--line:#e3e9e5;--green:#12513c;--paper:#fff;--bg:#f6f8f7}
body{font-family:-apple-system,"Segoe UI Variable Text","Segoe UI","Malgun Gothic",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14.5px}
h1{font-size:27px;letter-spacing:-.022em;font-weight:700}
h2{font-size:18px;letter-spacing:-.012em;font-weight:650}
h3{font-size:15px;letter-spacing:-.008em}
.eyebrow{font-size:10.5px;letter-spacing:.14em;color:#6d8177}
strong,b{font-weight:650}
button{border-radius:var(--r-md);font-weight:600;transition:background .12s,border-color .12s,box-shadow .12s}
button:hover{background:#f1f5f2;border-color:#c9d8cf}
.primary{box-shadow:0 1px 2px #0d3a2a1f}
.primary:hover{background:#0d4331}
.quiet:hover{background:#eef3f0}
input,select,textarea{border-radius:var(--r-sm);border-color:#d3ded7}
input:focus,select:focus,textarea:focus{border-color:var(--green);outline:2px solid #12513c26;outline-offset:0}
.panel{border-radius:var(--radius);box-shadow:0 1px 2px #10281e0a}
.tile:hover{transform:none}
/* Status chips: neutral surface, colour carried by a dot and the text, not a filled pill. */
.wf-chip{gap:6px;font-size:12px;font-weight:650;padding:4px 9px 4px 8px;border-radius:var(--r-sm);background:#f2f5f3;border-color:#e0e7e2;color:#42544c}
.wf-chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;opacity:.9}
.wf-chip b{font-weight:600;opacity:.72;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wf-chip.ok{background:#eef6f1;border-color:#d3e6da;color:#166148}
.wf-chip.run{background:#eef2fa;border-color:#d5e0f1;color:#2f5288}
.wf-chip.wait{background:#f2f5f3;border-color:#e0e7e2;color:#556660}
.wf-chip.act{background:#fdf5e6;border-color:#eddfc0;color:#8a5c17}
.wf-chip.err{background:#fceeec;border-color:#f0d2cd;color:#94372f}
/* Current stage panel: a white working surface with a rail that states whose turn it is. */
.wf-status{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--rail-tone,#cfdad4);border-radius:var(--radius);padding:26px 28px;gap:24px;box-shadow:0 1px 2px #10281e0a}
.wf-status.act{--rail-tone:#d9a441}
.wf-status.run{--rail-tone:#6e91cf}
.wf-status.ok{--rail-tone:#4f9370}
.wf-status-now h2{font-size:29px;font-weight:700;letter-spacing:-.026em;margin:5px 0 12px}
.wf-note{font-size:12.5px;color:#6b7c74;margin-top:18px;padding-top:14px;border-top:1px solid #eef2ef}
.wf-status-next{background:#f7faf8;border:1px solid var(--line);border-radius:var(--r-md);padding:20px;box-shadow:none;gap:14px}
.wf-next{font-size:16px;line-height:1.6;color:#33443d}
.wf-cta{padding:13px 18px;font-size:15px;border-radius:var(--r-md)}
.wf-track{border:1px solid var(--line);border-radius:var(--r-md);padding:11px 13px;background:#fbfcfb;min-width:162px}
.wf-track small{font-size:11px;letter-spacing:.02em;color:#6d8177;margin-bottom:6px}
.wf-stepper li{font-size:12.5px}
.wf-stepper li i{width:9px;height:9px}
.wf-stepper li.current i{box-shadow:0 0 0 3px #12513c1c}
/* Counts read as figures, not headline numbers. */
.wf-summary{border-radius:var(--radius);padding:20px 22px;box-shadow:0 1px 2px #10281e0a}
.wf-summary span{font-size:12.5px;font-weight:650;color:#42544c;letter-spacing:-.005em}
.wf-summary strong{font-size:30px;font-weight:660;margin:8px 0 6px;letter-spacing:-.03em}
.wf-summary small{font-size:12px;color:#6b7c74}
.wf-summary:hover{border-color:#b6ccbf;box-shadow:0 2px 8px #10281e12}
.wf-summary.selected{background:#f4f8f5;box-shadow:inset 0 0 0 1px #12513c33}
.wf-topic{border-radius:var(--r-md);padding:16px 18px;box-shadow:0 1px 2px #10281e08}
.wf-topic strong{font-size:15.5px;font-weight:650}
.wf-topic .wf-topic-next{font-size:12.5px;color:#5c6c65}
.wf-topic-tags em{font-size:12px;color:#6d8177}
.wf-report{border-radius:var(--radius)}
.wf-report-head{padding-bottom:12px;border-bottom:1px solid var(--line)}
.wf-secondary>small{font-size:10.5px;letter-spacing:.14em;color:#869790}
/* Flow guide: a numbered path with the button to press called out. */
.wf-flow{list-style:none;counter-reset:flow;padding:0;margin:16px 0 8px}
.wf-flow li{counter-increment:flow;position:relative;padding:12px 0 12px 34px;border-top:1px solid #eef2ef}
.wf-flow li:first-child{border-top:0}
.wf-flow li::before{content:counter(flow);position:absolute;left:0;top:12px;width:22px;height:22px;border-radius:50%;background:#eef3f0;color:#54685f;font-size:11.5px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.wf-flow li.current::before{background:var(--green);color:#fff}
.wf-flow li.current{background:#fbfdfc}
.wf-flow li>div{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.wf-flow b{font-size:14px;font-weight:650}
.wf-flow p{margin:6px 0 0;font-size:13px;line-height:1.65;color:#5c6c65;word-break:keep-all}
.wf-flow-press{display:inline-block;background:#eef3f0;border:1px solid #dbe6df;border-radius:5px;padding:1px 7px;font-size:12px;font-weight:650;color:#1d4e3c;white-space:nowrap}
.wf-commands{border-radius:var(--r-md)}
.wf-commands>summary{font-size:14px}
.wf-command p{font-size:13.5px;color:#3c4d46}
dialog{width:580px;border-radius:16px;padding:26px 28px}
dialog h3{margin-top:26px}
.notice{border-radius:var(--r-md);font-size:12.5px}

/* ── Design system pass ────────────────────────────────────────────────────────
   This screen is a working console, so it follows dense-product rules rather than
   landing-page ones. Depth comes from a surface ladder and 1px hairlines instead of
   stacked shadows (Linear). One accent, nothing decorative, every small tone carried
   to WCAG AA, and a tactile press on anything clickable (taste-skill). Function,
   markup and copy are untouched; only surface, rhythm, type and state change. */
:root{
 /* 4px spacing scale. Every container padding and gap below resolves to one of these. */
 --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;
 /* Surface ladder: page, card, inset, hover. */
 --bg:#f5f7f6;--paper:#fff;--surface-2:#f4f7f5;--surface-3:#eef2f0;
 /* Hairlines carry the structure that shadows used to. */
 --line:#e2e8e4;--line-strong:#ccd8d1;
 /* Ink ramp. Every step clears 4.5:1 on --bg and --paper, so small text stays legible. */
 --ink:#15231e;--ink-2:#3b4b44;--muted:#56675f;--ink-4:#5c6c65;
 /* A single accent, used for state and action only. */
 --green:#12513c;--accent-soft:#eaf2ed;--accent-ring:#12513c59}
body{background:var(--bg)}
/* Type scale. Replaces a dozen one-off sizes with steps that hold their proportion. */
h1{font-size:26px;letter-spacing:-.024em}
h2{font-size:17.5px}
h3{font-size:15px}
.eyebrow{color:var(--muted);font-size:10.5px;letter-spacing:.14em}
small,.muted,.wf-note,.wf-summary small,.wf-topic .wf-topic-next,.wf-topic-tags em,
.wf-secondary>small,.wf-stepper li,.wf-track small,.wf-flow p,.stat span,.tile p,
.pagehead p,.wf-command b,.wf-report-head span,.report-meta{color:var(--muted)}
.count,.stat b,.wf-summary strong,.wf-chip b,.wf-flow li::before{font-variant-numeric:tabular-nums}
/* Flat surfaces. A hairline states the edge; only overlays lift off the page. */
.panel,.wf-status,.wf-summary,.wf-topic,.stat,.records,.tile,.wf-report,.wf-track,.wf-status-next{box-shadow:none}
.panel,.wf-report{border:1px solid var(--line);border-radius:var(--radius)}
.wf-status{border-radius:var(--radius)}
.wf-status-next{background:var(--surface-2);border-color:var(--line)}
.wf-track{background:var(--surface-2)}
/* Density. The topic list is the working surface, so rows are rows, not posters. */
.wf-topic{padding:var(--s3) var(--s4);margin:6px 0;border-radius:var(--r-md)}
.wf-topic .wf-topic-tags{margin-bottom:6px}
.wf-topic strong{font-size:15px;line-height:1.45}
.wf-topic .wf-topic-next{margin-top:5px;font-size:12.5px}
.wf-summary{padding:var(--s4) var(--s5)}
.wf-summary strong{font-size:26px;margin:6px 0 4px}
.wf-counts{gap:var(--s3);margin:var(--s5) 0}
.stats{gap:var(--s3)}
.stat{padding:var(--s4) var(--s5)}
.stat b{font-size:26px;line-height:1.3}
.wf-status{padding:var(--s5) var(--s6);gap:var(--s5)}
.wf-status-now h2{font-size:26px;margin:var(--s1) 0 var(--s3)}
.wf-status-next{padding:var(--s4);justify-content:flex-start}
/* The next action sits under its own sentence. Stretching the panel should not open a hole between them. */
.wf-next{flex:0 1 auto}
.wf-note{margin-top:var(--s4);padding-top:var(--s3)}
.panel{padding:var(--s5)}
.wf-guide,.wf-task .panel,.wf-report{padding:var(--s5)}
.sectiontitle{margin:var(--s6) 0 var(--s3)}
.listitem{padding:var(--s3) 0}
.record{padding:var(--s3) var(--s5)}
.tilecopy{padding:var(--s4)}
/* Hover keeps the hairline, adds a surface lift, and never shifts the layout. */
.wf-topic:hover,.wf-summary:hover,.tile:hover,.record:hover{background:var(--surface-2);border-color:var(--line-strong);box-shadow:none}
.wf-summary.selected{background:var(--accent-soft);box-shadow:inset 0 0 0 1px #12513c33}
button:hover{background:var(--surface-3);border-color:var(--line-strong)}
.primary{box-shadow:none}
/* A press should feel like a press. Reduced-motion users still get the state, without travel. */
button:not(:disabled):active,.wf-topic:active,.wf-summary:active,.tile:active,.record:active{transform:translateY(1px)}
@media(prefers-reduced-motion:reduce){button:not(:disabled):active,.wf-topic:active,.wf-summary:active,.tile:active,.record:active{transform:none;background:var(--surface-3)}}
/* One focus ring everywhere, drawn outside the control so it never clips. */
:where(button,a,input,select,textarea,summary,dialog,[tabindex]):focus-visible{outline:2px solid var(--accent-ring);outline-offset:2px;border-radius:var(--r-sm)}
input:focus,select:focus,textarea:focus{border-color:var(--green);outline:2px solid var(--accent-ring);outline-offset:0}
/* Status chips: colour lives in the dot and the label, the surface stays quiet. */
.wf-chip{border-radius:999px;padding:3px 10px 3px 8px;font-size:11.5px}
.wf-stepper li.current i{box-shadow:0 0 0 3px #12513c24}
/* Report body keeps its editorial measure while matching the console's ink. */
.rich-report{color:var(--ink-2)}
.report-toc{background:var(--surface-2);border:1px solid var(--line)}
.report-section>h3{border-bottom-color:var(--line)}
.report-table tr:nth-child(even){background:var(--surface-2)}
pre,.checks label{background:var(--surface-2);border:1px solid var(--line)}
.wf-flow-press{background:var(--surface-3);border-color:var(--line-strong)}
/* Overlays are the only things allowed to float. */
dialog{border-color:var(--line-strong);box-shadow:0 24px 60px #0f291e26}
.toast{box-shadow:0 12px 32px #0f291e2e}

/* v2.2 status colour: colour means "needs you". 내 차례 amber, 오류 red; 완료·진행 중·대기 are neutral and differ by glyph and label. */
.wf-chip.ok,.wf-chip.run,.wf-chip.wait{background:#f2f5f3;border-color:#e0e7e2;color:#4f615a}
.wf-chip.ok::before{content:"✓";font-weight:800}
.wf-chip.run::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:wf-pulse 1.6s ease-in-out infinite}
.wf-chip.wait::before{content:"";width:6px;height:6px;border-radius:50%;border:1.5px solid currentColor}
@keyframes wf-pulse{50%{opacity:.25}}
.wf-topic.run,.wf-topic.ok{border-left-color:#d8e0da}.wf-topic.err{border-left-color:#d06a5f}
.wf-summary.run,.wf-summary.ok{border-left-color:#cfd8d3}.wf-summary.err{border-left-color:#d06a5f}
.wf-status.run,.wf-status.ok{--rail-tone:#cfdad4}.wf-status.err{--rail-tone:#d06a5f}
.wf-legend{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:-12px 0 8px}
.settings-advanced{margin-top:28px;border-top:1px solid var(--line);padding-top:8px}.settings-advanced>summary{cursor:pointer;font-weight:700;padding:12px 0;color:var(--muted)}

/* Batch selection is a mode, so it gets its own hue (indigo): green stays the app's primary, amber/red stay status. */
.topic-batch-bar{--bt-ink:#34407a;--bt-bg:#f3f4fb;--bt-line:#d9ddf0;--bt-main:#3f4d91;--bt-main-hover:#333f78}
.topic-batch-bar.is-off{display:flex;justify-content:flex-end;margin:6px 0 2px}
.topic-batch-bar.is-on{padding:18px 20px;background:var(--bt-bg);border:1px solid var(--bt-line);border-radius:13px;margin:14px 0 18px;display:grid;gap:14px}
.topic-batch-head{display:flex;align-items:center;gap:18px}.topic-batch-head strong{color:var(--bt-ink);font-variant-numeric:tabular-nums}
.topic-batch-switch{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 4px;background:none;border:0;font-size:14px;font-weight:650;color:var(--ink)}
.topic-batch-switch:hover{background:none}
.topic-batch-switch i{flex:none;width:40px;height:22px;border-radius:999px;background:#cbd3d0;position:relative;transition:background .15s}
.topic-batch-switch i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0003;transition:transform .15s}
.topic-batch-switch[aria-checked=true] i{background:var(--bt-main)}.topic-batch-switch[aria-checked=true] i::after{transform:translateX(18px)}
.topic-batch-actions{display:flex;flex-wrap:wrap;gap:8px}
.topic-batch-btn{height:40px;padding:0 16px;font-size:14px;font-weight:650;line-height:1;border-radius:10px;border:1px solid var(--bt-line);background:#fff;color:var(--bt-ink);white-space:nowrap}
.topic-batch-btn:hover{background:#eceffa}
.topic-batch-btn.primary{background:var(--bt-main);border-color:var(--bt-main);color:#fff}.topic-batch-btn.primary:hover{background:var(--bt-main-hover)}
.topic-batch-btn:disabled{cursor:not-allowed;opacity:.45}
.topic-batch-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.topic-batch-foot label{display:flex;align-items:center;gap:10px;margin:0;font-size:13px}
.topic-batch-foot select{width:auto;min-width:180px;max-width:280px;height:40px;padding:0 12px}
.topic-batch-foot p{font-size:13px;color:var(--muted);margin:0}
